[package]
name = "siksik"
version = "1.0.0"
description = "Siksik – lossless image compression"
authors = ["Siksik"]
edition = "2021"
license = "MIT"

[lib]
name = "siksik_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oxipng = { version = "10", default-features = false, features = ["parallel", "zopfli"] }
mozjpeg-sys = { version = "2", features = ["unwinding"] }
mozjpeg = "0.10"
webp = "0.3"
notify = "8"
walkdir = "2"
rayon = "1"
filetime = "0.2"
anyhow = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
